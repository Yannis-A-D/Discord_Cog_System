services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord_cog_bot
    restart: unless-stopped
    env_file:
      - bot.env
    volumes:
      # Optional: bind mount src/cogs for live hot-reloading in container without rebuilding
      - ./src/cogs:/app/src/cogs:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
